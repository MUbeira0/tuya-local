name: Robot vacuum
products:
  - id: j9wx0qronrtd9nxh
    manufacturer: Cecotec
    model: Conga 2290
entities:
  - entity: vacuum
    dps:
      - id: 1
        type: boolean
        name: power
        optional: true
      - id: 2
        type: boolean
        name: activate
        optional: true
      - id: 13
        type: boolean
        name: locate
        optional: true
      - id: 4
        type: string
        optional: true
        name: direction_control
        mapping:
          - dps_val: forward
            value: forward
          - dps_val: backward
            value: reverse
          - dps_val: turn_left
            value: turn_left
          - dps_val: turn_right
            value: turn_right
          - dps_val: stop
            value: stop
      - id: 3
        type: string
        name: command
        mapping:
          - dps_val: standby
            value: stop
          - dps_val: random
            value: random
          - dps_val: smart
            value: smart
          - dps_val: wall_follow
            value: wall_follow
          - dps_val: mop
            value: mop
          - dps_val: spiral
            value: clean_spot
          - dps_val: left_spiral
            value: left_spiral
          - dps_val: right_spiral
            value: right_spiral
          - dps_val: left_bow
            value: left_bow
          - dps_val: right_bow
            value: right_bow
          - dps_val: partial_bow
            value: partial_bow
          - dps_val: chargego
            value: return_to_base
      - id: 5
        type: string
        name: status
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: smart_clean
            value: cleaning
          - dps_val: wall_clean
            value: cleaning
          - dps_val: spot_clean
            value: cleaning
          - dps_val: mop_clean
            value: cleaning
          - dps_val: goto_charge
            value: returning
          - dps_val: charging
            value: charging
          - dps_val: charge_done
            value: docked
      - id: 14
        type: string
        name: fan_speed
        mapping:
          - dps_val: closed
            value: "off"
          - dps_val: normal
            value: normal
          - dps_val: strong
            value: strong
      - id: 18
        type: bitfield
        name: error
        optional: true
        hidden: true
  - entity: sensor
    class: battery
    dps:
      - id: 6
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 18
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 18
        type: bitfield
        name: fault_code
      - id: 18
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: edge_sweep
          - dps_val: 2
            value: middle_sweep
          - dps_val: 4
            value: left_wheel
          - dps_val: 8
            value: right_wheel
          - dps_val: 16
            value: garbage_box
          - dps_val: 32
            value: land_check
          - dps_val: 64
            value: collision
  - entity: select
    name: Water tank level
    icon: "mdi:water"
    category: config
    dps:
      - id: 20
        type: string
        name: option
        mapping:
          - dps_val: closed
            value: "off"
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high
  - entity: sensor
    name: Edge brush life
    category: diagnostic
    icon: "mdi:arrow-expand-all"
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: button
    name: Reset edge brush
    class: restart
    category: config
    dps:
      - id: 10
        type: boolean
        name: button
        optional: true
  - entity: sensor
    name: Roll brush life
    category: diagnostic
    icon: "mdi:tire"
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: button
    name: Reset roll brush
    class: restart
    category: config
    dps:
      - id: 11
        type: boolean
        name: button
        optional: true
  - entity: sensor
    translation_key: filter_life
    category: diagnostic
    dps:
      - id: 9
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 12
        name: button
        type: boolean
        optional: true
  - entity: sensor
    name: Mop cloth life
    category: diagnostic
    icon: "mdi:hydro-power"
    dps:
      - id: 21
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: button
    name: Reset mop cloth
    class: restart
    category: config
    dps:
      - id: 22
        name: button
        type: boolean
        optional: true
  - entity: sensor
    name: Clean area
    class: area
    category: diagnostic
    dps:
      - id: 16
        type: integer
        name: sensor
        unit: m2
        class: measurement
  - entity: sensor
    name: Clean time
    class: duration
    category: diagnostic
    dps:
      - id: 17
        type: integer
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    name: Clean record
    category: diagnostic
    hidden: true
    dps:
      - id: 15
        type: string
        name: sensor
        optional: true
