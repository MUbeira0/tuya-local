name: Lawnmower
products:
  - id: icw5sal7xfcevsve
    manufacturer: Parkside
    model: PMRDA 20-Li A1
entities:
  - entity: lawn_mower
    dps:
      - id: 101
        name: activity
        type: string
        mapping:
          - dps_val: STANDBY
            value: docked
          - dps_val: MOWING
            value: mowing
          - dps_val: CHARGING
            value: docked
          - dps_val: EMERGENCY
            value: error
          - dps_val: LOCKED
            value: docked
          - dps_val: PAUSED
            value: paused
          - dps_val: PARK
            value: returning
          - dps_val: CHARGING_WITH_TASK_SUSPEND
            value: docked
          - dps_val: FIXED_MOWING
            value: mowing
          - dps_val: ERROR
            value: error
          - dps_val: UPDATA
            value: docked
          - dps_val: SELF_TEST
            value: docked
      - id: 115
        name: command
        type: string
        optional: true
        mapping:
          - dps_val: StartMowing
            value: start_mowing
          - dps_val: StartFixedMowing
            value: start_mowing
            hidden: true
          - dps_val: PauseWork
            value: pause
          - dps_val: CancelWork
            value: pause
            hidden: true
          - dps_val: ContinueWork
            value: start_mowing
            hidden: true
          - dps_val: StartReturnStation
            value: dock
      - id: 101
        name: raw_activity
        type: string
      - id: 106
        type: integer
        name: password
        sensitive: true
      - id: 110
        type: string
        name: schedule
        optional: true
      - id: 112
        type: string
        name: work_log
        optional: true
      - id: 113
        type: string
        name: zones
        optional: true
  - entity: button
    name: Start fixed mowing
    icon: "mdi:mower-on"
    dps:
      - id: 115
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: StartFixedMowing
            value: true
  - entity: button
    name: Cancel mowing
    icon: "mdi:mower"
    dps:
      - id: 115
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: CancelWork
            value: true
  - entity: button
    name: Continue mowing
    icon: "mdi:mower-on"
    dps:
      - id: 115
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: ContinueWork
            value: true
  - entity: sensor
    class: battery
    dps:
      - id: 6
        type: integer
        optional: true
        name: sensor
        unit: "%"
        class: measurement
        mapping:
          - dps_val: null
            value_redirect: alt
      - id: 13
        type: integer
        optional: true
        name: alt
  - entity: binary_sensor
    class: battery_charging
    category: diagnostic
    dps:
      - id: 101
        type: string
        name: sensor
        optional: true
        persist: false
        mapping:
          - dps_val: CHARGING
            value: true
          - dps_val: CHARGING_WITH_TASK_SUSPEND
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 102
        type: bitfield
        name: sensor
        optional: true
        persist: false
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 102
        type: bitfield
        optional: true
        name: fault_code
      - id: 102
        type: bitfield
        optional: true
        persist: false
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: Tilted
          - dps_val: 2
            value: Too steep
          - dps_val: 4
            value: No boundary signal
          - dps_val: 8
            value: Left wheel motor error
          - dps_val: 16
            value: Right wheel motor error
          - dps_val: 32
            value: Battery voltage too high
          - dps_val: 64
            value: Battery temperature error
          - dps_val: 128
            value: Discharge error
          - dps_val: 256
            value: Charging over temperature
          - dps_val: 512
            value: Battery damaged
          - dps_val: 1024
            value: Battery low, discharge stopped
          - dps_val: 2048
            value: Charging current abnormal
          - dps_val: 4096
            value: Charging temperature error
          - dps_val: 8192
            value: Unexpected low battery
          - dps_val: 16384
            value: Battery error, reset needed
          - dps_val: 32768
            value: IMU sensor invalid
          - dps_val: 65536
            value: EMS sensor invalid
          - dps_val: 131072
            value: Rain sensor invalid
          - dps_val: 262144
            value: Hall sensor invalid
          - dps_val: 524288
            value: On slope over 3 seconds
          - dps_val: 1048576
            value: Outside working area
          - dps_val: 2097152
            value: Lifted
          - dps_val: 4194304
            value: Trapped
          - dps_val: 8388608
            value: Blade motor error
          - dps_val: 16777216
            value: Overturned
          - dps_val: 33554432
            value: Motor overcurrent
          - dps_val: 67108864
            value: Motor hall sensor error
          - dps_val: 134217728
            value: Motor disconnected
          - dps_val: 268435456
            value: EMS disconnected
          - dps_val: 536870912
            value: Motor error
      - id: 111
        type: string
        name: error_log
        optional: true
  - entity: sensor
    name: Problem
    icon: "mdi:robot-mower-outline"
    icon_priority: 2
    class: enum
    category: diagnostic
    dps:
      - id: 103
        name: sensor
        type: string
        optional: true
        persist: false
        mapping:
          - dps_val: null
            value: OK
          - dps_val: MOWER_LEAN
            value: Tilted
            icon: "mdi:angle-acute"
            icon_priority: 1
          - dps_val: MOWER_STEEP
            value: Steep
            icon: "mdi:slope-uphill"
            icon_priority: 1
          - dps_val: RAIN_PARK
            value: Raining
            icon: "mdi:weather-pouring"
            icon_priority: 1
          - dps_val: BATTERY_NOT_ENOUGH
            value: Low battery
            icon: "mdi:battery-low"
            icon_priority: 1
          - dps_val: NO_LOOP_SIGNAL
            value: Weak signal
            icon: "mdi:signal-cellular-1"
            icon_priority: 1
          - dps_val: CLOSE_TOPCOVER
            value: Close top cover
            icon: "mdi:door-open"
            icon_priority: 1
          - dps_val: MOWER_IN_STATION
            value: Docked
            icon: "mdi:mower"
            icon_priority: 1
          - dps_val: MOWER_OUT_STATION
            value: Undocked
            icon: "mdi:mower-on"
            icon_priority: 1
          - dps_val: PLACE_INSIDE_STATION
            value: Manually dock
            icon: "mdi:home-alert"
            icon_priority: 1
          - dps_val: FIXED_END
            value: Finished fixed mowing
            icon: "mdi:mower"
            icon_priority: 1
          - dps_val: CHARGING_DISCONNECT
            value: Disconnected
            icon: "mdi:power-plug-battery"
            icon_priority: 1
          - dps_val: CHARGING_PAUSE
            value: Paused charging
            icon: "mdi:battery-clock"
            icon_priority: 1
          - dps_val: WORK_INTERRUPT
            value: Interrupted
            icon: "mdi:alert-octogon"
            icon_priority: 1
          - dps_val: FIXED_MOWING_INTERUPT
            value: Interrupted fixed mowing
            icon: "mdi:alert-octogon"
            icon_priority: 1
          - dps_val: TURN_ON_BUTTON
            value: Turn on button
            icon: "mdi:button-pointer"
            icon_priority: 1
          - dps_val: PRESS_START_KEY
            value: Press start
            icon: "mdi:play"
            icon_priority: 1
          - dps_val: TIMESET_30MIN
